name: Backend CI

on:
  push:
    branches: [ "develop-be" ]
  pull_request:
    branches: [ "develop-be" ]
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  build:
    name: CI Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Start test DB with docker compose
        run: docker compose -f docker-compose.yml up -d hearit-test-db

      - name: Extract mapped MySQL port
        id: extract-mysql-port
        run: |
          PORT=$(docker port hearit-test-mysql 3306/tcp | cut -d: -f2)
          echo "MySQL mapped port: $PORT"
          echo "MYSQL_MAPPED_PORT=$PORT" >> $GITHUB_ENV

      - name: Generate application-secret.properties
        run: |
          mkdir -p src/main/resources
          cat <<EOF > src/main/resources/application-secret.properties
          mysql.root.password=${{ secrets.MYSQL_ROOT_PASSWORD }}
          jwt.secret=${{ secrets.JWT_SECRET }}
          jwt.expiration=${{ secrets.JWT_EXPIRATION }}
          server.port=${{ secrets.SERVER_PORT }}
          amazon.s3.bucket.url=${{ secrets.AMAZON_S3_BUCKET_URL }}
          db.mysql.host=localhost:${{ DB_MYSQL_HOST }}
          EOF

      - name: Run Tests
        run: ./gradlew test
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}

      - name: Build with Gradle
        run: ./gradlew build -x test
