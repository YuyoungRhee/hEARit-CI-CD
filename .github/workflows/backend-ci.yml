name: Backend CI

on:
  push:
    branches: [ "develop-be" ]
  pull_request:
    branches: [ "develop-be" ]
    paths:
      - 'backend/**'
  workflow_dispatch:

env:
  MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: $MYSQL_ROOT_PASSWORD
          MYSQL_DATABASE: hearit_db 
        options: >-
          --health-cmd="mysqladmin ping -uroot -p$MYSQL_ROOT_PASSWORD"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Generate application-secret.properties
        run: |
          mkdir -p src/main/resources
          cat <<EOF > src/main/resources/application-secret.properties
          mysql.root.password=$MYSQL_ROOT_PASSWORD
          jwt.secret=${{ secrets.JWT_SECRET }}
          jwt.expiration=${{ secrets.JWT_EXPIRATION }}
          server.port=${{ secrets.SERVER_PORT }}
          amazon.s3.bucket.url=${{ secrets.AMAZON_S3_BUCKET_URL }}
          db.mysql.host=127.0.0.1
          db.mysql.port=3306
          EOF

      - name: Debug - Show generated application-secret.properties
        run: cat src/main/resources/application-secret.properties

      - name: Run Tests
        run: ./gradlew test

      - name: Build with Gradle
        run: ./gradlew build -x test
